name: uni_events_app
description: A multi-tenant university events app with role-based shell navigation and dual-language localization.
version: 0.2.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

  # Firebase core & auth (placeholder setup)
  # firebase_core: ^3.0.0
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true # Enable automatic l10n generation
