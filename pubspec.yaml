name: uni_events_app
description: A multi-tenant university events app with role-based shell navigation and dual-language localization.
version: 0.2.8+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  file_picker: ^13.3.0
  add_2_calendar: ^3.1.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true # Enable automatic l10n generation
  # Plus Jakarta Sans (SIL Open Font License, see assets/fonts/PlusJakartaSans-OFL.txt).
  # Bundled instead of loaded from Google at runtime, so no user data goes to Google.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
